<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171D36" />
      <stop offset="0.52" stop-color="#0F1324" />
      <stop offset="1" stop-color="#090B12" />
    </linearGradient>
    <radialGradient id="amberAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(296 236) rotate(90) scale(190)">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.34" />
      <stop offset="0.55" stop-color="#F43F5E" stop-opacity="0.14" />
      <stop offset="1" stop-color="#0B0D14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(178 250) rotate(90) scale(165)">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.28" />
      <stop offset="1" stop-color="#0B0D14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="backCardFill" x1="110" y1="140" x2="286" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18263E" />
      <stop offset="1" stop-color="#0E1525" />
    </linearGradient>
    <linearGradient id="backCardBorder" x1="110" y1="140" x2="286" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6EE7B7" />
      <stop offset="0.5" stop-color="#10B981" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="frontCardFill" x1="190" y1="118" x2="386" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#251A3A" />
      <stop offset="0.5" stop-color="#16192E" />
      <stop offset="1" stop-color="#0E1120" />
    </linearGradient>
    <linearGradient id="frontCardBorder" x1="190" y1="118" x2="386" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEF08A" />
      <stop offset="0.45" stop-color="#F59E0B" />
      <stop offset="1" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="-68" y1="-58" x2="56" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FEF9C3" />
      <stop offset="0.45" stop-color="#FBBF24" />
      <stop offset="1" stop-color="#EA580C" />
    </linearGradient>
    <filter id="cardShadow" x="40" y="60" width="432" height="410" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="-8" dy="16" stdDeviation="16" flood-color="#02040A" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <circle cx="178" cy="250" r="165" fill="url(#emeraldAura)" />
  <circle cx="296" cy="236" r="190" fill="url(#amberAura)" />
  <rect x="20" y="20" width="472" height="472" rx="98" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="3" />

  <!-- Back Card (Kelime Sahtekari / Emerald) -->
  <g transform="translate(196 262) rotate(-14)">
    <rect x="-88" y="-122" width="176" height="244" rx="30" fill="url(#backCardFill)" stroke="url(#backCardBorder)" stroke-width="6" />
    <rect x="-74" y="-108" width="148" height="216" rx="20" stroke="#34D399" stroke-opacity="0.22" stroke-width="2" />
    <!-- Top-left emerald diamond pip -->
    <path d="M-52 -90 L-44 -78 L-52 -66 L-60 -78 Z" fill="#34D399" />
    <!-- Subtle question/clue emblem -->
    <circle cx="-18" cy="-4" r="34" stroke="#34D399" stroke-opacity="0.45" stroke-width="5" stroke-dasharray="10 8" />
    <path d="M-18 -24 L-12 -10 L2 -4 L-12 2 L-18 16 L-24 2 L-38 -4 L-24 -10 Z" fill="#6EE7B7" />
  </g>

  <!-- Front Card (Vampir-Koylu / Gold & Crimson) -->
  <g filter="url(#cardShadow)">
    <g transform="translate(290 254) rotate(8)">
      <rect x="-98" y="-136" width="196" height="272" rx="34" fill="url(#frontCardFill)" stroke="url(#frontCardBorder)" stroke-width="6.5" />
      <rect x="-82" y="-120" width="164" height="240" rx="22" stroke="#FDE68A" stroke-opacity="0.22" stroke-width="2" />

      <!-- Corner Star Pips -->
      <path d="M-60 -104 L-56 -94 L-46 -90 L-56 -86 L-60 -76 L-64 -86 L-74 -90 L-64 -94 Z" fill="#FDE68A" />
      <path d="M60 76 L64 86 L74 90 L64 94 L60 104 L56 94 L46 90 L56 86 Z" fill="#FB7185" />

      <!-- Glowing Crescent Moon (center emblem) -->
      <path
        d="M16 -55 A62 62 0 1 0 52 46 A50 50 0 1 1 16 -55 Z"
        fill="url(#moonGrad)"
      />

      <!-- 4-Point Hero Star Sparkle -->
      <path
        d="M32 -42 L39 -23 L58 -16 L39 -9 L32 10 L25 -9 L6 -16 L25 -23 Z"
        fill="#FEF9C3"
      />
      <!-- Small Accent Star -->
      <path
        d="M54 8 L57 16 L65 19 L57 22 L54 30 L51 22 L43 19 L51 16 Z"
        fill="#FDE68A"
      />
    </g>
  </g>

  <!-- Ambient Floating Sparkles -->
  <path d="M136 100 L141 113 L154 118 L141 123 L136 136 L131 123 L118 118 L131 113 Z" fill="#6EE7B7" />
  <path d="M406 382 L410 392 L420 396 L410 400 L406 410 L402 400 L392 396 L402 392 Z" fill="#FDBA74" />
</svg>
